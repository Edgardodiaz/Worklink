<html lang="es">
<head>

    <title>Inicio | Worklink</title>

<body class="home-page">

    <!-- ENCABEZADO -->
    <header class="home-header">
        <a class="home-logo" href="inicio.html">
            Work<span>link</span>
        </a>

        <nav class="home-nav" aria-label="Navegación principal">
            <a class="active" href="inicio.html">Inicio</a>
            <a href="categorias.html">Categorías</a>
            <a href="profesionales.html">Profesionales</a>
        </nav>

        <div class="home-actions">
            <a class="my-requests-link" href="solicitudes.html">
                Mis solicitudes
            </a>

            <a class="profile-link" href="mi-perfil.html">
                <span class="profile-avatar" id="avatar-usuario">U</span>
                <span>Mi perfil</span>
            </a>

            <button class="logout-button" id="btn-cerrar-sesion" type="button">
                Salir
            </button>
        </div>
    </header>
<body>
    <main>
            <!-- CATEGORÍAS -->
        <section class="home-section" id="categorias">
            <div class="section-heading">
                <div>
                    <span class="eyebrow">EXPLORÁ LOS OFICIOS</span>
                    <h2>¿Qué trabajo necesitás?</h2>
                    <p>Encontrá especialistas según el servicio que buscás.</p>
                </div>
            </div>

            <div class="category-grid">
                <button class="category-card" type="button"
                    data-categoria="electricidad">
                    <span class="category-icon">EL</span>
                    <span class="category-name">Electricidad</span>
                    <span class="category-description">
                        Instalaciones y reparaciones
                    </span>
                </button>

                <button class="category-card" type="button"
                    data-categoria="fontaneria">
                    <span class="category-icon">FO</span>
                    <span class="category-name">Fontanería</span>
                    <span class="category-description">
                        Tuberías y sistemas de agua
                    </span>
                </button>

                <button class="category-card" type="button"
                    data-categoria="construccion">
                    <span class="category-icon">CO</span>
                    <span class="category-name">Construcción</span>
                    <span class="category-description">
                        Albañilería y remodelación
                    </span>
                </button>

                <button class="category-card" type="button"
                    data-categoria="tecnologia">
                    <span class="category-icon">TI</span>
                    <span class="category-name">Tecnología</span>
                    <span class="category-description">
                        Reparación y soporte técnico
                    </span>
                </button>

                <button class="category-card" type="button"
                    data-categoria="pintura">
                    <span class="category-icon">PI</span>
                    <span class="category-name">Pintura</span>
                    <span class="category-description">
                        Acabados y renovación
                    </span>
                </button>

                <button class="category-card" type="button"
                    data-categoria="mecanica">
                    <span class="category-icon">ME</span>
                    <span class="category-name">Mecánica</span>
                    <span class="category-description">
                        Mantenimiento y reparación
                    </span>
                </button>
            </div>
        </section>

    <!-- PIE DE PÁGINA -->
    <footer class="home-footer">
        <a class="home-logo" href="inicio.html">
            Work<span>link</span>
        </a>

        <p>Conectamos talento con oportunidades.</p>

        <span>&copy; 2026 Worklink</span>
    </footer>
    </main>

    <script src="../js/main.js"></script>
    <script src="../js/tema.js"></script>
